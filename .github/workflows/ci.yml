name: Check Code

on:
    push:
    pull_request:

jobs:
    test:
        name: Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm test
            # The configuration is a module that runs; a typo in it would
            # otherwise first show in a project's release.
            - run: node -e "import('./release.config.mjs')"
